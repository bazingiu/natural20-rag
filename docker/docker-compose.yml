name: natural20_stack
services:
  # --- VECTOR DATABASE ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: natural20_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - natural20_net
    restart: unless-stopped

  # --- LOCAL LLM ENGINE ---
  ollama:
    image: ollama/ollama:latest
    container_name: natural20_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - natural20_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- OBSERVABILITY (Metrics & Tracing) ---
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: natural20_phoenix
    ports:
      - "6006:6006"
    networks:
      - natural20_net
    restart: unless-stopped

networks:
  natural20_net:
    driver: bridge